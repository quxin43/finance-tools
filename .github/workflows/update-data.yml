name: Update index data and publish site

on:
  schedule:
    - cron: "15 21 * * *"  # 05:15 SGT: after the US close (summer time)
    - cron: "15 22 * * *"  # 06:15 SGT: after the US close (winter time)
    - cron: "15 6 * * *"   # 14:15 SGT: final settlements for the previous day (Yahoo has closed the day; ICE gasoil published)
    - cron: "45 13 * * *"  # 21:45 SGT: US and European markets both open (runs in US summer time only)
    - cron: "45 14 * * *"  # 22:45 SGT: US and European markets both open (runs in US winter time only)
  workflow_dispatch:        # adds a "Run workflow" button for a manual update
  push:
    branches: [main]        # republish whenever you change the page

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  # Job 1: download the data, save it to the repository and package the site.
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install --upgrade yfinance pandas

      - name: Download data
        env:
          SCHEDULE: ${{ github.event.schedule }}   # empty for manual runs and pushes
          OILPRICEAPI_KEY: ${{ secrets.OILPRICEAPI_KEY }}   # UK gasoil (Settings > Secrets and variables > Actions)
        run: python scripts/update_data.py

      - name: Save data to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update index data $(date -u +%F)"
            # Another run (or a re-run of an older one) may have pushed first: put this commit on top of
            # the latest main, keeping this run's freshly downloaded data if the same file changed, then push.
            ok=0
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin main && git push; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              echo "Push failed, retrying ($i of 3)…"; sleep 15
            done
            [ "$ok" = 1 ] || { echo "Could not save the data after 3 tries"; exit 1; }
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  # Job 2: publish the packaged site. It runs as its own job because deploy-pages can miss an artifact uploaded
  # a moment earlier in the same job ("No artifacts named github-pages were found", actions/deploy-pages#451).
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before retrying the deploy
        if: steps.deploy.outcome == 'failure'
        run: sleep 60

      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
