name: Update index data and publish site

on:
  schedule:
    - cron: "15 21 * * *"  # 05:15 SGT: indices every day; energy when the US is on summer time
    - cron: "15 22 * * *"  # 06:15 SGT: energy only, when the US is on winter time
  workflow_dispatch:        # adds a "Run workflow" button for a manual update
  push:
    branches: [main]        # republish whenever you change the page

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install --upgrade yfinance pandas

      - name: Download data
        env:
          SCHEDULE: ${{ github.event.schedule }}   # empty for manual runs and pushes
          OILPRICEAPI_KEY: ${{ secrets.OILPRICEAPI_KEY }}   # UK gasoil (Settings > Secrets and variables > Actions)
        run: python scripts/update_data.py

      - name: Save data to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update index data $(date -u +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
